name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / typecheck / test / build / verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Strict mode is the release-grade gate: any placeholder SHA in
      # public/ocr/ocr.lock.json fails the build. Released in v1.1.4-beta.
      EA_NITI_OCR_STRICT: '1'

    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # LFS must be initialized + pulled BEFORE npm install so that the
      # corpus, OCR, and bespoke-LLM assets are real bytes rather than
      # pointer files. This is the path Strike 4.0 enforces locally.
      - name: Git LFS install
        run: git lfs install --local

      - name: Git LFS pull (corpus + OCR + models)
        run: git lfs pull --include=public/ocr,public/models,public/manifests

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ── v1.1.4-beta gates ────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Accessibility audit
        run: npm run test:a11y

      - name: Verify corpus integrity
        run: npm run verify:corpus

      - name: Verify OCR lockfile (strict)
        run: npm run verify:ocr

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test -- --no-file-parallelism

      - name: Build
        run: npm run build

      # Smoke gate uses the committed mock GGUF; it must always pass.
      - name: Sovereign Engine smoke (Playwright)
        run: npm run test:e2e:sovereign-smoke
        env:
          CI: '1'

  strict:
    name: setup:local (idempotency)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci
    env:
      # In CI we still want the strict OCR gate to trip if a placeholder
      # SHA is present, so we set STRICT but provide a custom base model
      # URL to keep the forge step offline-friendly.
      EA_NITI_OCR_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Git LFS install
        run: git lfs install --local
      - name: Git LFS pull
        run: git lfs pull --include=public/ocr,public/models,public/manifests
      - name: Install
        run: npm ci --no-audit --no-fund
      # Sanity check: the script must be present and `--help`able
      # even when no LFS assets are present (a missing LFS asset is OK
      # here, the lockfile `verify` step is the source of truth).
      - name: setup:local — dry-run step 1 only
        run: |
          node -e "require('fs').accessSync('scripts/setupLocal.mjs', require('fs').constants.R_OK)"
          node -e "require('fs').accessSync('scripts/forge_bespoke_model.mjs', require('fs').constants.R_OK)"
          node -e "require('fs').accessSync('scripts/ocrArtifacts.mjs', require('fs').constants.R_OK)"
          node -e "require('fs').accessSync('public/ocr/ocr.lock.json', require('fs').constants.R_OK)"
          node -e "require('fs').accessSync('public/ocr/ocr_manifest.json', require('fs').constants.R_OK)"
          node -e "require('fs').accessSync('public/models/NOTICE.txt', require('fs').constants.R_OK)"
          echo "All one-command bootstrap files are present."
        shell: bash
